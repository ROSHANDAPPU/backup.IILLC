  <style>
    :root {
      --color-bg-primary: #0B0E14; /* Deep Navy */
      --color-action: #1D4ED8;    /* Cobalt */
      --color-accent: #93C5FD;    /* Azure */
      --color-heading: #E7EAEE;   /* Off‑white */
      --color-body: #A3AAB4;      /* Slate */
    }
    body, html {
      font-family: 'Satoshi', 'Inter', 'SF Pro Display', system-ui, sans-serif;
      color: var(--color-body);
      background: var(--color-bg-primary);
      margin: 0;
      line-height: 1.6;
    }
    .fixed-topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: var(--color-bg-primary);
      z-index: 30;
    }
    .fixed-topbar .logo-container img { height: 200px; }
    .btn-call-now {
      background: var(--color-action);
      color: #FAF7F2;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      transition: all .3s ease;
    }
    .thank-you-container {
      padding: 140px 20px 60px;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }
    .heading-premium {
      color: var(--color-heading);
      font-size: clamp(32px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.25;
      margin: 0 auto 16px;
      max-width: 700px;
    }
    .badge-timeline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid rgba(147,197,253,.2);
      border-radius: 8px;
      background: rgba(29,78,216,.05);
      margin: 12px auto 24px;
    }
    .badge-timeline .icon-clock { color: var(--color-accent); font-size: 16px; }
    /* Description text */
    .description {
      color: var(--color-body);
      font-size: 17px;
      line-height: 1.6;
      max-width: 500px;
      margin: 0 auto 40px;
    }

    /* Open Email App Button */
    .btn-email {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      max-width: 400px;
      padding: 18px;
      background: transparent;
      border: 1px solid rgba(147, 197, 253, 0.3);
      border-radius: 12px;
      color: var(--color-heading);
      text-decoration: none;
      font-weight: 600;
      font-size: 18px;
      transition: all 0.3s ease;
      margin-bottom: 24px;
    }
    .btn-email:hover {
      background: rgba(29, 78, 216, 0.1);
      border-color: var(--color-accent);
      transform: translateY(-2px);
    }
    .btn-email i {
      color: var(--color-accent);
      font-size: 20px;
    }

    /* Secure Footer */
    .secure-footer {
      padding: 40px 0 60px;
      text-align: center;
    }

    .secure-footer p {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--color-body);
      opacity: 0.6;
      margin: 0;
    }

    .secure-footer p .icon-lock {
      color: var(--color-accent);
      font-size: 13px;
    }

    /* Custom Floating Cursor */
    .medium-image-container {
      max-width: 600px;
      margin: 0 auto 40px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(147, 197, 253, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .medium-image {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .medium-image-container:hover .medium-image {
      transform: scale(1.05);
    }

    /* Custom Floating Cursor */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      background: rgba(147, 197, 253, 0.6);
      border: 2px solid rgba(147, 197, 253, 0.8);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transition: all 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .cursor-follower {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2px solid rgba(147, 197, 253, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      background: rgba(147, 197, 253, 0.1);
      transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    body.cursor-hover .cursor {
      transform: scale(1.5);
      background: rgba(147, 197, 253, 0.3);
      border: 2px solid rgba(147, 197, 253, 1);
      box-shadow: 0 0 15px rgba(147, 197, 253, 0.8), 0 0 30px rgba(147, 197, 253, 0.4);
    }
    body.cursor-click .cursor { transform: scale(0.8); background: rgba(0, 0, 0, 0.8); }
    body.cursor-text .cursor {
      transform: scaleX(0.3) scaleY(1.5);
      background: rgba(147, 197, 253, 0.4);
      border: 1px solid rgba(147, 197, 253, 0.9);
      border-radius: 2px;
    }
    * { cursor: none !important; }

    @media (max-width: 768px) {
      .fixed-topbar { padding:0 20px; }
      .fixed-topbar .logo-container img { height: 200px; }
      .btn-call-now { padding:8px 16px; font-size:14px; }
      .thank-you-container { padding:110px 16px 40px; }
    }
  </style>
  <script>
    // Prevent Calendly auto‑scroll on load (same as high‑urgency page)
    (function(){
      let locked = true;
      const unlock = () => { if (locked) { locked = false; window.removeEventListener('scroll', lockScroll); } };
      const lockScroll = () => { if (locked && window.scrollY>0) window.scrollTo(0,0); };
      window.addEventListener('scroll', lockScroll, {passive:false});
      window.addEventListener('wheel', unlock, {passive:true});
      window.addEventListener('touchmove', unlock, {passive:true});
      window.addEventListener('keydown', unlock, {passive:true});
      window.addEventListener('mousedown', unlock, {passive:true});
      window.scrollTo(0,0);
      window.addEventListener('load',()=>window.scrollTo(0,0));
    })();
  </script>
</head>
<body>
  <div class="cursor"></div>
  <div class="cursor-follower"></div>
  <header class="fixed-topbar">
    <div class="logo-container">
      <a href="../index.html"><img src="../assets/images/01-02_logo_mark/SVGs/cobalt.no-background.svg" alt="Interior Illusions" /></a>
    </div>
    <a href="tel:+19723704873" class="btn-call-now"><i class="fa-solid fa-phone"></i> Call Now</a>
  </header>
  <main class="thank-you-container">
    <!-- Dynamic Service Image -->
    <div class="medium-image-container">
      <img id="service-image" src="../assets/images/PORTFOLIO/FINALS1/IMG_7207.JPG" alt="Luxury Remodel by Interior Illusions" class="medium-image"/>
    </div>

    <h1 class="heading-premium">Your Custom Estimate<br/>is on the Way!</h1>
    
    <div class="badge-timeline">
      <span class="icon-clock"><i class="fa-regular fa-clipboard"></i></span>
      <span style="color: var(--color-accent); font-weight:500;">Timeline:</span>
      <span style="color: var(--color-heading); font-weight:700;">Next 1‑3 Months</span>
    </div>
    
    <p class="description">
      We have sent a detailed breakdown to your email. Check your inbox to review the next steps for your upcoming project.
    </p>

    <a href="mailto:" class="btn-email">
      <i class="fa-solid fa-envelope"></i>
      Open Email App
    </a>
  </main>

  <script>
    // Dynamic Image Logic based on Service Selection
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const service = urlParams.get('service');
      const imgElement = document.getElementById('service-image');
      
      if (!service || !imgElement) return;

      const serviceImages = {
        'bathroom': '../assets/images/PORTFOLIO/FINALS1/IMG_7207.JPG',
        'kitchen': '../assets/images/PORTFOLIO/FINALS1/IMG_7383.JPG',
        'full-home-remodel': '../assets/images/PORTFOLIO/FINALS1/IMG_7585.JPG',
        'interior-upgrades': '../assets/images/PORTFOLIO/FINALS1/IMG_7855.JPG'
      };

      if (serviceImages[service]) {
        imgElement.src = serviceImages[service];
      }
    })();
  </script>

  <footer class="secure-footer">
    <p><span class="icon-lock"><i class="fa-solid fa-lock"></i></span> Your information is secure and confidential.</p>
  </footer>
  <script>
    // Custom floating cursor (same as other pages)
    (function(){
      const cursor=document.querySelector('.cursor');
      const follower=document.querySelector('.cursor-follower');
      if(!cursor||!follower) return;
      let mx=0,my=0,cx=0,cy=0,fx=0,fy=0;
      document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
      function animate(){
        cx+= (mx-cx)*0.2; cy+= (my-cy)*0.2;
        follower.style.transform=`translate(${fx-20}px,${fy-20}px)`;
        cursor.style.transform=`translate(${cx-10}px,${cy-10}px)`;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
